<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="A simple Snake game">
	<title>Snake</title>

	<style>
		:root {
			--background: #000;
			--board: plum;
			--snake: darkviolet;
			--food: deeppink;
			--text: #fff;
			--accent: #00ff00;
		}

		* {
			box-sizing: border-box;
		}

		body {
			display: flex;
			min-height: 100vh;
			margin: 0;
			padding: 1rem;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			gap: 1rem;
			background: var(--background);
			color: var(--text);
			font-family: system-ui, sans-serif;
			text-align: center;
		}

		::selection {
			color: #fff;
			background: #ff1493;
		}

		.home-link {
			color: var(--text);
			font-size: 1.75rem;
			font-weight: 700;
			text-shadow: 5px 5px 5px var(--accent);
		}

		canvas {
			display: block;
			width: min(90vw, 400px);
			height: auto;
			background: var(--board);
			border: 2px solid #fff;
			image-rendering: pixelated;
		}

		.controls {
			display: flex;
			align-items: center;
			gap: 0.75rem;
		}

		button {
			padding: 0.5rem 0.9rem;
			cursor: pointer;
		}

		footer {
			margin-top: 0.5rem;
		}
	</style>
</head>

<body>
	<a class="home-link" href="index.html">HOMEPAGE</a>

	<canvas
		id="can"
		width="400"
		height="400"
		aria-label="Snake game">
		Your browser does not support HTML5 canvas.
	</canvas>

	<div class="controls">
		<button id="versionButton" type="button">Version</button>
		<button id="speedButton" type="button">Speed</button>
	</div>

	<footer>PoweredByYaozeYE</footer>

	<script>
		'use strict';

		const canvas = document.getElementById('can');
		const context = canvas.getContext('2d');

		const GRID_SIZE = 20;
		const CELL_SIZE = canvas.width / GRID_SIZE;
		const GAME_SPEED = 100;

		const COLORS = {
			board: 'plum',
			snake: 'darkviolet',
			food: 'deeppink'
		};

		const DIRECTIONS = {
			ArrowLeft: -1,
			ArrowUp: -GRID_SIZE,
			ArrowRight: 1,
			ArrowDown: GRID_SIZE
		};

		let snake = [41, 40];
		let direction = 1;
		let food = 43;
		let gameRunning = true;

		function drawCell(position, color) {
			const x = (position % GRID_SIZE) * CELL_SIZE;
			const y = Math.floor(position / GRID_SIZE) * CELL_SIZE;

			context.fillStyle = color;
			context.fillRect(x + 1, y + 1, CELL_SIZE - 2, CELL_SIZE - 2);
		}

		function isWallCollision(position, movement) {
			return (
				position < 0 ||
				position >= GRID_SIZE * GRID_SIZE ||
				(movement === 1 && position % GRID_SIZE === 0) ||
				(movement === -1 && position % GRID_SIZE === GRID_SIZE - 1)
			);
		}

		function placeFood() {
			const availableCells = [];

			for (let cell = 0; cell < GRID_SIZE * GRID_SIZE; cell++) {
				if (!snake.includes(cell)) {
					availableCells.push(cell);
				}
			}

			if (availableCells.length === 0) {
				gameRunning = false;
				alert('YOU WIN!');
				return;
			}

			food = availableCells[
				Math.floor(Math.random() * availableCells.length)
			];

			drawCell(food, COLORS.food);
		}

		function gameOver() {
			gameRunning = false;
			alert('GAME OVER');
		}

		function gameLoop() {
			if (!gameRunning) {
				return;
			}

			const nextPosition = snake[0] + direction;
			snake.unshift(nextPosition);

			if (
				isWallCollision(nextPosition, direction) ||
				snake.indexOf(nextPosition, 1) !== -1
			) {
				gameOver();
				return;
			}

			drawCell(nextPosition, COLORS.snake);

			if (nextPosition === food) {
				placeFood();
			} else {
				drawCell(snake.pop(), COLORS.board);
			}

			setTimeout(gameLoop, GAME_SPEED);
		}

		document.addEventListener('keydown', (event) => {
			const newDirection = DIRECTIONS[event.key];

			if (newDirection === undefined) {
				return;
			}

			event.preventDefault();

			const isReverseDirection =
				snake.length > 1 &&
				snake[1] - snake[0] === newDirection;

			if (!isReverseDirection) {
				direction = newDirection;
			}
		});

		document.getElementById('versionButton').addEventListener('click', () => {
			alert('Version 1 Stable_Build20171007A GameVersion1.21');
		});

		document.getElementById('speedButton').addEventListener('click', () => {
			alert(`${GAME_SPEED}ms/step`);
		});

		drawCell(food, COLORS.food);
		gameLoop();
	</script>
</body>
</html>
