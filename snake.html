<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
	<meta http-equiv="Cache-Control" content="no-siteapp" />
	<!--[if lte IE 9]><script src="select/selectivizr.js"></script><![endif]-->
	<link rel="shortcut icon" href="favicon.ico" type="image/x-icon" sizes="any" />
	<title>Snake</title>

	<style>
		:root {
			--background: #000;
			--board: plum;
			--snake: darkviolet;
			--food: deeppink;
			--text: #fff;
			--accent: #00ff00;
		}

		* {
			box-sizing: border-box;
		}

		body {
			display: flex;
			min-height: 100vh;
			margin: 0;
			padding: 1rem;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			gap: 1rem;
			background: var(--background);
			color: var(--text);
			font-family: system-ui, sans-serif;
			text-align: center;
		}

		::selection {
			color: #fff;
			background: #ff1493;
		}

		.home-link {
			color: var(--text);
			font-size: 1.75rem;
			font-weight: 700;
			text-shadow: 5px 5px 5px var(--accent);
		}

		canvas {
			display: block;
			width: min(90vw, 400px);
			height: auto;
			background: var(--board);
			border: 2px solid #fff;
			image-rendering: pixelated;
		}

		.controls,
		.speed-control {
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 0.75rem;
			flex-wrap: wrap;
		}

		button {
			padding: 0.5rem 0.9rem;
			cursor: pointer;
		}

		input[type='range'] {
			width: min(70vw, 240px);
			cursor: pointer;
		}

		footer {
			margin-top: 0.5rem;
		}
	</style>
</head>

<body>
	<a class="home-link" href="index.html">HOMEPAGE</a>

	<canvas
		id="can"
		width="400"
		height="400"
		aria-label="Snake game">
		Your browser does not support HTML5 canvas.
	</canvas>

	<div class="controls">
		<button id="startButton" type="button">Start</button>
		<button id="pauseButton" type="button">Pause</button>
		<button id="resetButton" type="button">Reset</button>
		<button id="versionButton" type="button">Version</button>
		<button id="speedButton" type="button">Speed</button>
	</div>

	<div class="speed-control">
		<label for="speedSlider">Speed: <output id="speedValue">100</output>ms/step</label>
		<input
			id="speedSlider"
			type="range"
			min="40"
			max="300"
			step="10"
			value="100"
			aria-label="Game speed in milliseconds per step" />
	</div>

	<footer>PoweredByYaozeYE</footer>

	<script>
		'use strict';

		const canvas = document.getElementById('can');
		const context = canvas.getContext('2d');
		const speedSlider = document.getElementById('speedSlider');
		const speedValue = document.getElementById('speedValue');

		const GRID_SIZE = 20;
		const CELL_SIZE = canvas.width / GRID_SIZE;
		const DEFAULT_GAME_SPEED = 100;
		const MIN_GAME_SPEED = 40;
		const MAX_GAME_SPEED = 300;

		const COLORS = {
			board: 'plum',
			snake: 'darkviolet',
			food: 'deeppink'
		};

		const DIRECTIONS = {
			ArrowLeft: -1,
			ArrowUp: -GRID_SIZE,
			ArrowRight: 1,
			ArrowDown: GRID_SIZE
		};

		let snake;
		let direction;
		let food;
		let gameRunning = false;
		let gameFinished = false;
		let gameTimer;
		let gameSpeed = DEFAULT_GAME_SPEED;

		function drawCell(position, color) {
			const x = (position % GRID_SIZE) * CELL_SIZE;
			const y = Math.floor(position / GRID_SIZE) * CELL_SIZE;

			context.fillStyle = color;
			context.fillRect(x + 1, y + 1, CELL_SIZE - 2, CELL_SIZE - 2);
		}

		function drawBoard() {
			context.fillStyle = COLORS.board;
			context.fillRect(0, 0, canvas.width, canvas.height);

			snake.forEach((cell) => drawCell(cell, COLORS.snake));
			drawCell(food, COLORS.food);
		}

		function isWallCollision(position, movement) {
			return (
				position < 0 ||
				position >= GRID_SIZE * GRID_SIZE ||
				(movement === 1 && position % GRID_SIZE === 0) ||
				(movement === -1 && position % GRID_SIZE === GRID_SIZE - 1)
			);
		}

		function placeFood() {
			const availableCells = [];

			for (let cell = 0; cell < GRID_SIZE * GRID_SIZE; cell++) {
				if (!snake.includes(cell)) {
					availableCells.push(cell);
				}
			}

			if (availableCells.length === 0) {
				gameRunning = false;
				gameFinished = true;
				clearTimeout(gameTimer);
				alert('YOU WIN!');
				return;
			}

			food = availableCells[
				Math.floor(Math.random() * availableCells.length)
			];
		}

		function gameOver() {
			gameRunning = false;
			gameFinished = true;
			clearTimeout(gameTimer);
			alert('GAME OVER');
		}

		function gameLoop() {
			if (!gameRunning) {
				return;
			}

			const nextPosition = snake[0] + direction;
			snake.unshift(nextPosition);

			if (
				isWallCollision(nextPosition, direction) ||
				snake.indexOf(nextPosition, 1) !== -1
			) {
				gameOver();
				return;
			}

			if (nextPosition === food) {
				placeFood();
			} else {
				drawCell(snake.pop(), COLORS.board);
			}

			drawCell(nextPosition, COLORS.snake);
			gameTimer = setTimeout(gameLoop, gameSpeed);
		}

		function startGame() {
			if (gameFinished) {
				return;
			}

			if (!gameRunning) {
				gameRunning = true;
				gameLoop();
			}
		}

		function pauseGame() {
			gameRunning = false;
			clearTimeout(gameTimer);
		}

		function resetGame() {
			clearTimeout(gameTimer);
			snake = [41, 40];
			direction = 1;
			food = 43;
			gameRunning = false;
			gameFinished = false;
			drawBoard();
		}

		document.addEventListener('keydown', (event) => {
			const newDirection = DIRECTIONS[event.key];

			if (newDirection === undefined) {
				return;
			}

			event.preventDefault();

			const isReverseDirection =
				snake.length > 1 &&
				snake[1] - snake[0] === newDirection;

			if (!isReverseDirection) {
				direction = newDirection;
			}
		});

		document.getElementById('startButton').addEventListener('click', startGame);
		document.getElementById('pauseButton').addEventListener('click', pauseGame);
		document.getElementById('resetButton').addEventListener('click', resetGame);

		document.getElementById('versionButton').addEventListener('click', () => {
			alert('Version 1 Stable_Build20260917A GameVersion1.22');
		});

		document.getElementById('speedButton').addEventListener('click', () => {
			alert(`${gameSpeed}ms/step`);
		});

		speedSlider.addEventListener('input', (event) => {
			gameSpeed = Number(event.target.value);
			speedValue.value = gameSpeed;
			speedValue.textContent = gameSpeed;
		});

		speedSlider.min = MIN_GAME_SPEED;
		speedSlider.max = MAX_GAME_SPEED;
		speedValue.value = gameSpeed;
		speedValue.textContent = gameSpeed;
		resetGame();
	</script>
</body>
</html>
