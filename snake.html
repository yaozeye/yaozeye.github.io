		<title>Snake</title>
		<style>
			body ::selection{
				color: #FFFFFF;
				background: #FF1493;
			}
			body {
				display: flex;
				height: 100vh;
				margin: 0;

	<body>
		<a href="index.html">
			<font style="font-size:28px;color:white;text-shadow: 5px 5px 5px #00FF00;">
				<b>
					HOMEPAGE
				</b>
			</font>
		</a>
		<br />
		<canvas id="can" width="400" height="400" style="background-color: plum">
			Your browser doesn't support HTML5 canvas. Please update Internet Explorer to at least IE10 and enable ActiveX and scripting. Google Chrome is recommended.
		</canvas>

		<script>
			var snake = [41, 40],
				// The snake array represents the snake's body and its initial positions.
				direction = 1,
				// 1 means right, -1 means left, 20 means down, and -20 means up.
				food = 43,
				// The position of the food.
				n,
				// The position of the snake's next movement.
				box = document.getElementById('can').getContext('2d');
				// Positions 0 through 399 represent a [0–19] × [0–19] grid.
				// Each grid cell is 20 pixels wide.

			function draw(seat, color) {
				box.fillStyle = color;
				box.fillRect(seat % 20 * 20 + 1, ~~(seat / 20) * 20 + 1, 18, 18);
				// Draw a rectangle using the specified color.
				// The position is calculated as x and y coordinates, with a width and height of 18 pixels.
			}

			document.onkeydown = function(evt) {
				// Change the direction when an arrow key is pressed.
				direction = snake[1] - snake[0] == (n = [-1, -20, 1, 20][(evt || event).keyCode - 37] || direction) ? direction : n;
			};

			!function() {
				snake.unshift(n = snake[0] + direction);
				// n is the position of the snake's new head.

				if (
					snake.indexOf(n, 1) > 0 ||
					n < 0 ||
					n > 399 ||
					direction == 1 && n % 20 == 0 ||
					direction == -1 && n % 20 == 19
				) {
					// Check whether the snake has collided with itself or with a wall.
					return alert("GAME OVER");
				}

				draw(n, "darkviolet");
				// Draw the snake's new head.

				if(n == food) {
					// When the snake eats the food, add a new segment and generate new food.
					// The tail is not removed, so the snake grows.
					while (snake.indexOf(food = ~~(Math.random() * 400)) > 0);
					draw(food, "deeppink");
				} else {
					// When the snake does not eat the food, remove the tail to move the snake forward.
					draw(snake.pop(),"plum");
				}

				setTimeout(arguments.callee, 100);
				// Execute the function once every 100 milliseconds to control the snake's speed.
			}();
		</script>

		<br />
		<br />

		<button type="button" onclick="alert('Version 1 Stable_Build20171007A GameVersion1.21')">
				Version
		</button>

		<button type="button" onclick="alert('100ms/step')">

		</button>
